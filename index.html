<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="preloader">Loading...</div>

<header class="hero">
  <h1>🎉 Happy Birthday!</h1>
  <p class="typing">Wishing you a day filled with love, laughter, and happiness.</p>
  <button id="confettiBtn">🎁 Surprise Me</button>
</header>

<section id="countdown">
  <h2>Countdown</h2>
  <div class="timer">
    <div><span id="days">00</span><small>Days</small></div>
    <div><span id="hours">00</span><small>Hours</small></div>
    <div><span id="minutes">00</span><small>Minutes</small></div>
    <div><span id="seconds">00</span><small>Seconds</small></div>
  </div>
</section>

<section id="gallery">
<h2>Memory Gallery</h2>
<div class="gallery-grid">
<img src="assets/images/photo1.jpg" alt="">
<img src="assets/images/photo2.jpg" alt="">
<img src="assets/images/photo3.jpg" alt="">
<img src="assets/images/photo4.jpg" alt="">
<img src="assets/images/photo5.jpg" alt="">
<img src="assets/images/photo6.jpg" alt="">
</div>
</section>

<section id="message">
<h2>Birthday Message</h2>
<p>May this year bring you endless joy, success, and unforgettable memories. Happy Birthday! ❤️</p>
</section>

<section class="music-card">
<h2>Music</h2>
<audio id="music" src="assets/music/birthday.mp3" loop></audio>
<button id="musicBtn">▶ Play / Pause</button>
</section>

<button class="back-to-top">⬆</button>

<script src="js/script.js"></script>
</body>
</html>
